# OpsPilot local development stack.
# No top-level `version:` key — obsolete in Compose v2.
# Validate with: docker compose config

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HOST_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/api:/var/www/html:ro
    depends_on:
      - php-fpm
    restart: unless-stopped
    networks:
      - opspilot

  php-fpm:
    build:
      context: ./
      dockerfile: docker/php/Dockerfile
      args:
        WWWUSER: ${WWWUSER:-1000}
        WWWGROUP: ${WWWGROUP:-1000}
    working_dir: /var/www/html
    volumes:
      - ./apps/api:/var/www/html
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "9000"
    restart: unless-stopped
    networks:
      - opspilot

  php-cli:
    build:
      context: ./
      dockerfile: docker/php/Dockerfile
      args:
        WWWUSER: ${WWWUSER:-1000}
        WWWGROUP: ${WWWGROUP:-1000}
    working_dir: /var/www/html
    volumes:
      - ./apps/api:/var/www/html
    env_file: .env
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - opspilot

  web:
    build:
      context: ./
      dockerfile: docker/web/Dockerfile
    working_dir: /app
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules
    ports:
      - "${WEB_HOST_PORT:-5173}:5173"
    # Dev stack: source is bind-mounted and node_modules lives on a named volume,
    # so deps are installed on container start before the dev server runs
    # (mirrors the `agent` service). After `down -v` the volume is empty, so this
    # keeps a clean rebuild self-bootstrapping.
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      VITE_API_PROXY_TARGET: http://nginx:80
    networks:
      - opspilot

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-opspilot}
      MYSQL_USER: ${DB_USERNAME:-opspilot}
      MYSQL_PASSWORD: ${DB_PASSWORD:-opspilot}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_HOST_PORT:-33061}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - opspilot

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_HOST_PORT:-63790}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - opspilot

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-opspilot}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-opspilot}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      - opspilot

  agent:
    build:
      context: ./
      dockerfile: docker/agent/Dockerfile
    working_dir: /app
    volumes:
      - ./services/agent:/app
      - agent-node-modules:/app/node_modules
    env_file: .env
    environment:
      AGENT_DRIVER: ${AGENT_DRIVER:-fake}
    depends_on:
      rabbitmq:
        condition: service_healthy
    # Dev stack: source is bind-mounted and node_modules lives on a named volume,
    # so install + build happen on container start before the worker runs.
    command: ["sh", "-c", "npm install && npm run build && npm run start"]
    networks:
      - opspilot

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  web-node-modules:
  agent-node-modules:

networks:
  opspilot:
    driver: bridge
