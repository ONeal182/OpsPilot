server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        # Re-resolve the php-fpm service name at request time via Docker's
        # embedded DNS, so nginx keeps working after `docker compose up -d`
        # recreates php-fpm with a new container IP (otherwise: cached IP -> 502).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_php php-fpm:9000;
        fastcgi_pass $upstream_php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
